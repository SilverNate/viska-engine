version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: viska
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ../auth-service
      dockerfile: ../auth-service/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: viska
      REDIS_ADDR: redis:6379

  data-service:
    build:
      context: ../data-service
      dockerfile: ../data-service/Dockerfile
    ports:
      - "8081:8081"
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=viska
    depends_on:
      - postgres

volumes:
  pgdata: